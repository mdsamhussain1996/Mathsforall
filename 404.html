<script>
  document.getElementById('nf-path').textContent = location.pathname;
  // Animate y = 1/(x - a): the curve rushes up the asymptote and never arrives.
  (function () {
    var cv = document.getElementById('nf-canvas'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height, t = 0;
    function frame() {
      t += 0.012; var a = W * 0.62 + Math.sin(t) * 6;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(W, H - 30); ctx.stroke();
      ctx.setLineDash([6, 6]); ctx.strokeStyle = '#10b981'; ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(a, H); ctx.stroke(); ctx.setLineDash([]);
      var grad = ctx.createLinearGradient(0, H, 0, 0); grad.addColorStop(0, '#d97706'); grad.addColorStop(1, '#fbbf24');
      ctx.strokeStyle = grad; ctx.lineWidth = 3.5; ctx.beginPath();
      var first = true;
      for (var x = 10; x < a - 2; x += 2) {
        var y = H - 30 - 60 / ((a - x) / 40 + 0.001) * 0.9;
        if (y < -10) break;
        if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.fillStyle = '#a8a29e'; ctx.font = '12px Inter, sans-serif'; ctx.fillText('x → a⁻  ⇒  y → ∞', 12, 20);
      if (!reduce) requestAnimationFrame(frame);
    }
    var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (reduce) t = 0.5;
    frame();
  })();
</script>
